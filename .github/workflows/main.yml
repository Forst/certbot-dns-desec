name: Tests

on:
  push:
    branches:
      - main
      - 'forst-*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # You can use PyPy versions in python-version.
      # For example, pypy2 and pypy3
      matrix:
        python-version: [
          '3.10',
          '3.11',
          '3.12',
          '3.13',
        ]
        certbot-version: [
          '2.11.1',
          '3.3.0',
          '4.2.0',
          '5.6.0',
        ]
        exclude:
          - python-version: '3.13'
            certbot-version: '2.11.1'
        include:
          - python-version: '3.14'
            certbot-version: '5.6.0'

    steps:
    # v7.0.0
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    # v6.3.0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Requirements
      run: |
        pip3 install -r requirements.txt
        pip3 install certbot~=$CERTBOT_VERSION acme~=$CERTBOT_VERSION -c constraints.txt .
        pip3 freeze
      env:
        CERTBOT_VERSION: ${{ matrix.certbot-version }}

    - name: flake8 Linter
      run:  python3 -m flake8 certbot_dns_desec

    - name: Unit tests
      run: python3 -m unittest certbot_dns_desec/dns_desec_test.py
